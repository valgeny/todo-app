name: Deploy GCP

# Deploys Cloud Run API + static FE bucket. Infra (AR, secrets, bucket, WIF) is
# managed by local Terraform; this workflow builds/pushes and updates the service.
# Auth: GitHub OIDC → Workload Identity Federation (no JSON key).
# Config: GitHub Environment "sandbox" variables (see docs/ci-cd.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-gcp-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy Cloud Run + FE
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: sandbox
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      AR_REPO: ${{ vars.AR_REPO }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      IMAGE_NAME: ${{ vars.IMAGE_NAME }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f server/Dockerfile \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "IMAGE_REF=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_REF}" \
            --quiet
          API_URI=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')
          echo "API_URI=${API_URI}" >> "$GITHUB_ENV"
          echo "### Cloud Run" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: ${API_URI}" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke health check
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            code=$(curl -sf -o /dev/null -w '%{http_code}' "${API_URI}/health" || echo 000)
            [ "$code" = "204" ] && exit 0
            sleep 3
          done
          echo "Health check failed against ${API_URI}/health" >&2
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build web (pointed at Cloud Run)
        env:
          # VITE_ORIGIN only needs a port for vite.config validation; API URL is what the SPA uses.
          VITE_ORIGIN: http://127.0.0.1:3000
          VITE_API_ORIGIN: ${{ env.API_URI }}
          # Relative asset URLs required for https://storage.googleapis.com/<bucket>/index.html
          VITE_BASE: ./
        run: |
          set -euo pipefail
          cat > web/config/.env.local <<EOF
          VITE_ORIGIN=${VITE_ORIGIN}
          VITE_API_ORIGIN=${VITE_API_ORIGIN}
          EOF
          yarn build

      - name: Upload frontend to GCS
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: web/dist
          destination: ${{ env.FRONTEND_BUCKET }}
          parent: false
          process_gcloudignore: false

      - name: Frontend summary
        run: |
          FE_URL="https://storage.googleapis.com/${FRONTEND_BUCKET}/index.html"
          echo "### Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${FE_URL}" >> "$GITHUB_STEP_SUMMARY"
