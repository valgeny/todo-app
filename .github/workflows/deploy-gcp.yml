name: Deploy GCP

# Deploys Cloud Run API + MCP + agent + static FE bucket in parallel where possible.
# Infra (AR, secrets, bucket, WIF) is managed by local Terraform.
# Auth: GitHub OIDC → Workload Identity Federation (no JSON key).
# Config: GitHub Environment "sandbox" variables (see docs/ci-cd.md).

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-gcp-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy-api:
    name: API build + deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: sandbox
    outputs:
      api_uri: ${{ steps.deploy.outputs.api_uri }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      AR_REPO: ${{ vars.AR_REPO }}
      API_CLOUD_RUN_SERVICE: ${{ vars.API_CLOUD_RUN_SERVICE }}
      API_IMAGE_NAME: ${{ vars.API_IMAGE_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push API image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.API_IMAGE_NAME }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f server/Dockerfile \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "IMAGE_REF=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run API
        id: deploy
        run: |
          set -euo pipefail
          gcloud run deploy "${API_CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_REF}" \
            --quiet
          API_URI=$(gcloud run services describe "${API_CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')
          echo "api_uri=${API_URI}" >> "$GITHUB_OUTPUT"
          echo "### API" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${API_URI}" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke API health
        run: |
          set -euo pipefail
          API_URI="${{ steps.deploy.outputs.api_uri }}"
          for i in $(seq 1 20); do
            code=$(curl -sf -o /dev/null -w '%{http_code}' "${API_URI}/health" || echo 000)
            [ "$code" = "204" ] && exit 0
            sleep 3
          done
          echo "Health check failed against ${API_URI}/health" >&2
          exit 1

  deploy-mcp:
    name: MCP build + deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: sandbox
    # Parallel with deploy-api; TODO_API_ORIGIN from the live API service URL.
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      AR_REPO: ${{ vars.AR_REPO }}
      API_CLOUD_RUN_SERVICE: ${{ vars.API_CLOUD_RUN_SERVICE }}
      MCP_CLOUD_RUN_SERVICE: ${{ vars.MCP_CLOUD_RUN_SERVICE }}
      MCP_IMAGE_NAME: ${{ vars.MCP_IMAGE_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Resolve live API URI
        id: api
        run: |
          set -euo pipefail
          API_URI=$(gcloud run services describe "${API_CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')
          echo "api_uri=${API_URI}" >> "$GITHUB_OUTPUT"

      - name: Build and push MCP image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.MCP_IMAGE_NAME }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f mcp/Dockerfile \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "IMAGE_REF=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run MCP
        id: deploy
        run: |
          set -euo pipefail
          gcloud run deploy "${MCP_CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_REF}" \
            --allow-unauthenticated \
            --update-env-vars="TODO_API_ORIGIN=${{ steps.api.outputs.api_uri }}" \
            --quiet
          MCP_URI=$(gcloud run services describe "${MCP_CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')
          echo "mcp_uri=${MCP_URI}" >> "$GITHUB_OUTPUT"
          echo "### MCP" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${MCP_URI}/mcp" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke MCP health
        run: |
          set -euo pipefail
          MCP_URI="${{ steps.deploy.outputs.mcp_uri }}"
          for i in $(seq 1 20); do
            code=$(curl -sf -o /dev/null -w '%{http_code}' "${MCP_URI}/health" || echo 000)
            [ "$code" = "204" ] && exit 0
            sleep 3
          done
          echo "Health check failed against ${MCP_URI}/health" >&2
          exit 1

  deploy-agent:
    name: Agent build + deploy
    # Parallel with API/MCP; uses the already-deployed MCP URL (same run.app hostname).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: sandbox
    # Image only; IAP HTTPS LB is Terraform. Smoke via gcloud (run.app is internal-LB).
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      AR_REPO: ${{ vars.AR_REPO }}
      MCP_CLOUD_RUN_SERVICE: ${{ vars.MCP_CLOUD_RUN_SERVICE || 'todo-sandbox-mcp' }}
      AGENT_CLOUD_RUN_SERVICE: ${{ vars.AGENT_CLOUD_RUN_SERVICE || 'todo-sandbox-agent' }}
      AGENT_IMAGE_NAME: ${{ vars.AGENT_IMAGE_NAME || 'todo-sandbox-agent' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Resolve live MCP endpoint
        id: mcp
        run: |
          set -euo pipefail
          MCP_URI=$(gcloud run services describe "${MCP_CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')
          echo "mcp_endpoint=${MCP_URI}/mcp" >> "$GITHUB_OUTPUT"

      - name: Build and push agent image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.AGENT_IMAGE_NAME }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f agent/Dockerfile \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            agent
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "IMAGE_REF=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run agent
        id: deploy
        run: |
          set -euo pipefail
          gcloud run deploy "${AGENT_CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_REF}" \
            --update-env-vars="TODO_MCP_URL=${{ steps.mcp.outputs.mcp_endpoint }}" \
            --quiet
          AGENT_URI=$(gcloud run services describe "${AGENT_CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')
          echo "agent_uri=${AGENT_URI}" >> "$GITHUB_OUTPUT"
          echo "### Agent" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloud Run: ${AGENT_URI} (internal LB / IAP only)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public URL: Terraform output \`agent_iap_url\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Confirm agent revision Ready
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            ready=$(gcloud run services describe "${AGENT_CLOUD_RUN_SERVICE}" \
              --project="${GCP_PROJECT_ID}" \
              --region="${GCP_REGION}" \
              --format='value(status.conditions[0].status)' || echo Unknown)
            [ "$ready" = "True" ] && exit 0
            sleep 5
          done
          echo "Agent service did not become Ready" >&2
          gcloud run services describe "${AGENT_CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" >&2 || true
          exit 1

  deploy-copilot:
    name: Copilot build + deploy
    needs: [deploy-agent]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: sandbox
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      AR_REPO: ${{ vars.AR_REPO }}
      AGENT_CLOUD_RUN_SERVICE: ${{ vars.AGENT_CLOUD_RUN_SERVICE || 'todo-sandbox-agent' }}
      COPILOT_CLOUD_RUN_SERVICE: ${{ vars.COPILOT_CLOUD_RUN_SERVICE || 'todo-sandbox-copilot' }}
      COPILOT_IMAGE_NAME: ${{ vars.COPILOT_IMAGE_NAME || 'todo-sandbox-copilot' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Build and push copilot image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.COPILOT_IMAGE_NAME }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 -f copilot/Dockerfile \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
          echo "IMAGE_REF=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Deploy Cloud Run copilot
        run: |
          set -euo pipefail
          AGENT_URI=$(gcloud run services describe "${AGENT_CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')
          gcloud run deploy "${COPILOT_CLOUD_RUN_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --image="${IMAGE_REF}" \
            --update-env-vars="LANGGRAPH_URL=${AGENT_URI},LANGGRAPH_GRAPH_ID=todo_agent" \
            --quiet
          echo "### Copilot" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${IMAGE_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public URL: Terraform output \`copilot_url\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-fe:
    name: Frontend build + upload
    needs: [deploy-api]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: sandbox
    env:
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build web (pointed at Cloud Run)
        env:
          VITE_ORIGIN: http://127.0.0.1:3000
          VITE_API_ORIGIN: ${{ needs.deploy-api.outputs.api_uri }}
          VITE_BASE: ./
        run: |
          set -euo pipefail
          cat > web/config/.env.local <<EOF
          VITE_ORIGIN=${VITE_ORIGIN}
          VITE_API_ORIGIN=${VITE_API_ORIGIN}
          EOF
          yarn build

      - name: Upload frontend to GCS
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: web/dist
          destination: ${{ env.FRONTEND_BUCKET }}
          parent: false
          process_gcloudignore: false

      - name: Frontend summary
        run: |
          FE_URL="https://storage.googleapis.com/${FRONTEND_BUCKET}/index.html"
          echo "### Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${FE_URL}" >> "$GITHUB_STEP_SUMMARY"
