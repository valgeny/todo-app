name: Deploy GCP

# Deploys Cloud Run API + MCP + agent + copilot + static FE bucket in parallel
# where possible. Cloud Run build/deploy uses reusable deploy-cloudrun-job.yml.
# Infra (AR, secrets, bucket, WIF) is managed by local Terraform.
# Auth: GitHub OIDC → Workload Identity Federation (no JSON key).
# Config: GitHub Environment "sandbox" variables (see docs/ci-cd.md).

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-gcp-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy-api:
    name: API build + deploy
    uses: ./.github/workflows/deploy-cloudrun-job.yml
    permissions:
      contents: read
      id-token: write
    with:
      job_name: API build + deploy
      environment: sandbox
      dockerfile: server/Dockerfile
      image_name_var: API_IMAGE_NAME
      service_name_var: API_CLOUD_RUN_SERVICE
      smoke: health
      summary_title: API

  deploy-mcp:
    name: MCP build + deploy
    # Parallel with deploy-api; TODO_API_ORIGIN from the live API service URL.
    uses: ./.github/workflows/deploy-cloudrun-job.yml
    permissions:
      contents: read
      id-token: write
    with:
      job_name: MCP build + deploy
      environment: sandbox
      dockerfile: mcp/Dockerfile
      image_name_var: MCP_IMAGE_NAME
      service_name_var: MCP_CLOUD_RUN_SERVICE
      allow_unauthenticated: true
      source_service_name_var: API_CLOUD_RUN_SERVICE
      source_env_key: TODO_API_ORIGIN
      smoke: health
      summary_title: MCP

  deploy-agent:
    name: Agent build + deploy
    # Parallel with API/MCP; uses the already-deployed MCP URL.
    # Image only; IAP HTTPS LB is Terraform. Smoke via Ready (run.app is LB/VPC-only).
    uses: ./.github/workflows/deploy-cloudrun-job.yml
    permissions:
      contents: read
      id-token: write
    with:
      job_name: Agent build + deploy
      environment: sandbox
      dockerfile: agent/Dockerfile
      context: agent
      image_name_var: AGENT_IMAGE_NAME
      service_name_var: AGENT_CLOUD_RUN_SERVICE
      image_name_fallback: todo-sandbox-agent
      service_name_fallback: todo-sandbox-agent
      source_service_name_var: MCP_CLOUD_RUN_SERVICE
      source_service_name_fallback: todo-sandbox-mcp
      source_env_key: TODO_MCP_URL
      source_url_suffix: /mcp
      smoke: ready
      timeout_minutes: 30
      summary_title: Agent

  deploy-copilot:
    name: Copilot build + deploy
    needs: [deploy-agent]
    uses: ./.github/workflows/deploy-cloudrun-job.yml
    permissions:
      contents: read
      id-token: write
    with:
      job_name: Copilot build + deploy
      environment: sandbox
      dockerfile: copilot/Dockerfile
      image_name_var: COPILOT_IMAGE_NAME
      service_name_var: COPILOT_CLOUD_RUN_SERVICE
      image_name_fallback: todo-sandbox-copilot
      service_name_fallback: todo-sandbox-copilot
      source_service_name_var: AGENT_CLOUD_RUN_SERVICE
      source_service_name_fallback: todo-sandbox-agent
      source_env_key: LANGGRAPH_URL
      extra_env_vars: LANGGRAPH_GRAPH_ID=todo_agent
      timeout_minutes: 30
      summary_title: Copilot

  deploy-fe:
    name: Frontend build + upload
    needs: [deploy-api]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: sandbox
    env:
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build web (pointed at Cloud Run)
        env:
          VITE_ORIGIN: http://127.0.0.1:3000
          VITE_API_ORIGIN: ${{ needs.deploy-api.outputs.service_uri }}
          VITE_BASE: ./
        run: |
          set -euo pipefail
          cat > web/config/.env.local <<EOF
          VITE_ORIGIN=${VITE_ORIGIN}
          VITE_API_ORIGIN=${VITE_API_ORIGIN}
          EOF
          yarn build

      - name: Upload frontend to GCS
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: web/dist
          destination: ${{ env.FRONTEND_BUCKET }}
          parent: false
          process_gcloudignore: false

      - name: Frontend summary
        run: |
          FE_URL="https://storage.googleapis.com/${FRONTEND_BUCKET}/index.html"
          echo "### Frontend" >> "$GITHUB_STEP_SUMMARY"
          echo "- ${FE_URL}" >> "$GITHUB_STEP_SUMMARY"
