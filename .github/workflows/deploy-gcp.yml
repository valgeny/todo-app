name: Deploy GCP

# Deploys Cloud Run API + MCP + agent + copilot + static FE bucket in parallel
# where possible. Cloud Run build/deploy uses reusable deploy-cloudrun-job.yml.
# Infra (AR, secrets, bucket, WIF, env, IAM) is managed by local Terraform.
# Auth: GitHub OIDC → Workload Identity Federation (no JSON key).
# Config: GitHub Environment "sandbox" variables (see docs/ci-cd.md).

on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-gcp-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy-api:
    name: API build + deploy
    uses: ./.github/workflows/deploy-cloudrun-job.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: sandbox
      workdir: server
      image_name_var: API_IMAGE_NAME
      service_name_var: API_CLOUD_RUN_SERVICE

  deploy-mcp:
    name: MCP build + deploy
    uses: ./.github/workflows/deploy-cloudrun-job.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: sandbox
      workdir: mcp
      image_name_var: MCP_IMAGE_NAME
      service_name_var: MCP_CLOUD_RUN_SERVICE

  deploy-agent:
    name: Agent build + deploy
    uses: ./.github/workflows/deploy-cloudrun-job.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: sandbox
      workdir: agent
      image_name_var: AGENT_IMAGE_NAME
      service_name_var: AGENT_CLOUD_RUN_SERVICE

  deploy-copilot:
    name: Copilot build + deploy
    uses: ./.github/workflows/deploy-cloudrun-job.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: sandbox
      workdir: copilot
      image_name_var: COPILOT_IMAGE_NAME
      service_name_var: COPILOT_CLOUD_RUN_SERVICE

  deploy-fe:
    name: Frontend build + upload
    needs: [deploy-api]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: sandbox
    outputs:
      fe_url: ${{ steps.fe.outputs.fe_url }}
    env:
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build web (pointed at Cloud Run)
        env:
          VITE_ORIGIN: http://127.0.0.1:3000
          VITE_API_ORIGIN: ${{ needs.deploy-api.outputs.service_uri }}
          VITE_BASE: ./
        run: |
          set -euo pipefail
          cat > web/config/.env.local <<EOF
          VITE_ORIGIN=${VITE_ORIGIN}
          VITE_API_ORIGIN=${VITE_API_ORIGIN}
          EOF
          yarn build

      - name: Upload frontend to GCS
        uses: google-github-actions/upload-cloud-storage@v3
        with:
          path: web/dist
          destination: ${{ env.FRONTEND_BUCKET }}
          parent: false
          process_gcloudignore: false

      - name: FE URL
        id: fe
        run: echo "fe_url=https://storage.googleapis.com/${FRONTEND_BUCKET}/index.html" >> "$GITHUB_OUTPUT"

  summary:
    name: Deploy summary
    needs: [deploy-api, deploy-mcp, deploy-agent, deploy-copilot, deploy-fe]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Write step summary
        env:
          API_URI: ${{ needs.deploy-api.outputs.service_uri }}
          API_IMG: ${{ needs.deploy-api.outputs.image_ref }}
          MCP_URI: ${{ needs.deploy-mcp.outputs.service_uri }}
          MCP_IMG: ${{ needs.deploy-mcp.outputs.image_ref }}
          AGENT_URI: ${{ needs.deploy-agent.outputs.service_uri }}
          AGENT_IMG: ${{ needs.deploy-agent.outputs.image_ref }}
          COPILOT_URI: ${{ needs.deploy-copilot.outputs.service_uri }}
          COPILOT_IMG: ${{ needs.deploy-copilot.outputs.image_ref }}
          FE_URL: ${{ needs.deploy-fe.outputs.fe_url }}
        run: |
          set -euo pipefail
          {
            echo "### API"
            echo "- ${API_URI:-*(failed)*}"
            [ -n "${API_IMG:-}" ] && echo "- Image: \`${API_IMG}\`"
            echo
            echo "### MCP"
            echo "- ${MCP_URI:-*(failed)*}"
            [ -n "${MCP_IMG:-}" ] && echo "- Image: \`${MCP_IMG}\`"
            echo
            echo "### Agent"
            echo "- ${AGENT_URI:-*(failed)*}"
            [ -n "${AGENT_IMG:-}" ] && echo "- Image: \`${AGENT_IMG}\`"
            echo
            echo "### Copilot"
            echo "- ${COPILOT_URI:-*(failed)*}"
            [ -n "${COPILOT_IMG:-}" ] && echo "- Image: \`${COPILOT_IMG}\`"
            echo
            echo "### Frontend"
            echo "- ${FE_URL:-*(failed)*}"
          } >> "$GITHUB_STEP_SUMMARY"
