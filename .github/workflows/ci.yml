name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare env files
        run: |
          cp web/config/.env.example web/config/.env.local
          test -f server/config/.env.test

      - name: Lint
        run: yarn lint

      - name: Build web
        run: yarn build

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare env files
        run: |
          cp web/config/.env.example web/config/.env.local
          test -f server/config/.env.test

      - name: Integration tests
        run: yarn test:integration

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: End-to-end tests
        run: yarn test:e2e

      # Phase 1: downloadable Actions artifacts (PRs and every push)
      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      # Phase 2: GitHub Pages — main at /<report>/<slot>/, other branches at /<branch>/...
      - name: Restore previous report site
        if: ${{ always() && github.event_name == 'push' }}
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: pages-site
          workflow: ci.yml
          path: report-site-prev
          if_no_artifact_found: warn
          github_token: ${{ secrets.GITHUB_TOKEN }}

      # Keep main reports when a feature branch publishes (latest pages-site may be branch-only).
      - name: Restore main Pages baseline
        if: ${{ always() && github.event_name == 'push' && github.ref_name != 'main' }}
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          name: github-pages
          workflow: ci.yml
          branch: main
          path: report-site-main-pages
          if_no_artifact_found: warn
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve publish target
        id: slots
        if: ${{ always() && github.event_name == 'push' }}
        env:
          RUN_TIMESTAMP: ${{ github.run_started_at }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          TS=$(node -e 'const t=process.env.RUN_TIMESTAMP; console.log(Math.floor(new Date(t||Date.now()).getTime()/1000))')
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "slots=latest,$TS" >> "$GITHUB_OUTPUT"

          if [ "$BRANCH_NAME" = "main" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "Publishing at site root (main)"
          else
            BASE=$(node .github/scripts/pages-site.mjs sanitize-branch "$BRANCH_NAME")
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
            echo "Publishing under /${BASE}/"
          fi

      - name: Prepare report site
        id: prepare
        if: ${{ always() && steps.slots.outcome == 'success' }}
        run: |
          set -euo pipefail
          PREV_ARGS=()

          # Unpack official Pages artifact from main when present (artifact.tar).
          if [ -f report-site-main-pages/artifact.tar ]; then
            mkdir -p report-site-main
            tar -xf report-site-main-pages/artifact.tar -C report-site-main
            PREV_ARGS+=(--prev report-site-main)
          elif [ -d report-site-main-pages ]; then
            PREV_ARGS+=(--prev report-site-main-pages)
          fi

          if [ -d report-site-prev ]; then
            PREV_ARGS+=(--prev report-site-prev)
          fi

          node .github/scripts/pages-site.mjs prepare \
            --site report-site \
            "${PREV_ARGS[@]}"

      - name: Publish integration report
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: ./.github/actions/publish-pages-report
        with:
          report: allure
          source: allure-report
          slots: ${{ steps.slots.outputs.slots }}
          base: ${{ steps.slots.outputs.base }}

      - name: Publish end-to-end report
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        uses: ./.github/actions/publish-pages-report
        with:
          report: playwright
          source: playwright-report
          slots: ${{ steps.slots.outputs.slots }}
          base: ${{ steps.slots.outputs.base }}

      - name: Finalize report site
        id: assemble
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=(
            finalize
            --site report-site
            --keep 30
            --run-url "$RUN_URL"
            --history-slot "${{ steps.slots.outputs.ts }}"
          )
          if [ -n "${{ steps.slots.outputs.base }}" ]; then
            args+=(--base "${{ steps.slots.outputs.base }}")
          fi
          node .github/scripts/pages-site.mjs "${args[@]}"

      - name: Upload GitHub Pages artifact
        if: ${{ always() && steps.assemble.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: report-site

      - name: Upload pages site history artifact
        if: ${{ always() && steps.assemble.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: pages-site
          path: report-site/
          retention-days: 90

  deploy-reports:
    name: Deploy reports to GitHub Pages
    needs: [build, test]
    if: ${{ always() && github.event_name == 'push' && needs.test.result != 'cancelled' && needs.test.result != 'skipped' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
