[project]
name = "todo-agent"
version = "0.1.0"
description = "LangGraph + Gemini agent for the To-Do List API (LangSmith evals)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Valerian Geny" }]
dependencies = [
  "httpx>=0.28.0",
  "langchain-core>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "langgraph>=0.3.0",
  "langsmith>=0.3.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
todo-agent = "todo_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/todo_agent"]

[tool.hatch.build.targets.wheel.sources]
"src/todo_agent" = "todo_agent"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
