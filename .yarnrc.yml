nodeLinker: node-modules

# Yarn 4.18 defaults this to false for new projects. Yarn 1 ran install
# scripts, which better-sqlite3, esbuild, and Playwright need.
enableScripts: true

# Yarn 4.18 holds packages published in the last day. Yarn 1 did not.
npmMinimalAgeGate: 0

# Replaces Yarn 1 `--network-timeout 600000` (milliseconds).
httpTimeout: 600000
