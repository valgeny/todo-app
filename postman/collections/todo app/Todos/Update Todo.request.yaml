$kind: http-request
description: Updates title, description, and/or dueDate. Does not change completion.
url: "{{protocol}}://{{host}}:{{port}}/api/v0/todos/{{todoId}}"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Buy oat milk",
      "description": "Updated description",
      "dueDate": "2026-10-20"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      pm.test('Title updated', function () {
        pm.expect(pm.response.json().title).to.eql('Buy oat milk');
      });
    language: text/javascript
order: 4000
